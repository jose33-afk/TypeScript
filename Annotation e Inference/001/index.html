<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validador de Palavras</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen">
  <div class="bg-white p-6 rounded-lg shadow-lg w-80 border-4 border-slate-200 border-y-slate-500">
    <input
      type="text"
      id="inputTxt"
      class="border border-gray-300 p-2 rounded w-full text-center text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      placeholder="Digite uma palavra"
    />
    <div class="status mt-4 text-center font-semibold text-gray-700 bg-white p-2 rounded border border-gray-200 min-h-[2.5rem]">
    </div>
  </div>
  <script src="./exercicio.js"></script>

</html>
